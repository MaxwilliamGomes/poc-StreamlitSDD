# ShopAgent Dashboard: Postgres. The optional shadowtraffic service needs a license.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shopagent}
      POSTGRES_USER: ${POSTGRES_USER:-shopagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopagent}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shopagent}"]
      interval: 5s
      timeout: 5s
      retries: 5

  shadowtraffic:
    image: shadowtraffic/shadowtraffic:2.4.2
    env_file:
      - ../.env
      - license.env
    volumes:
      - ./shadowtraffic.json:/home/config.json
      - ./data/reviews:/data/reviews
    command: ["--config", "/home/config.json"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
